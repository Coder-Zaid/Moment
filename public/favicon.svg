<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Rounded Squircle Base in Terracotta with Rich Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c97d66"/>
      <stop offset="50%" stop-color="#b86b53"/>
      <stop offset="100%" stop-color="#8c4430"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#df9b52"/>
    </linearGradient>
    <filter id="shadow" x="0" y="2" width="64" height="62" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#f7e6d2" stroke-width="1.5"/>

  <!-- Vintage Camera Body Silhouette -->
  <!-- Top Flash/Finder Bump -->
  <rect x="23" y="14" width="18" height="6" rx="3" fill="#1c1815" stroke="url(#goldGrad)" stroke-width="1.2"/>
  
  <!-- Red Recording Indicator Dot -->
  <circle cx="27" cy="17" r="1.5" fill="#ef4444"/>

  <!-- Main Camera Frame Body -->
  <rect x="13" y="19" width="38" height="28" rx="7" fill="#14110e" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Outer Lens Ring (Gold Metallic) -->
  <circle cx="32" cy="33" r="10" fill="#241e18" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Inner Aperture Lens -->
  <circle cx="32" cy="33" r="7" fill="#0d0b09"/>

  <!-- Signature Editorial Monogram 'M' Centered in Lens -->
  <text x="32" y="37" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-size="11" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="0">M</text>

  <!-- Lens Flare Reflection Glass Arc -->
  <path d="M 27 28 A 6 6 0 0 1 37 28" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Signature Sparkle / Star in Top Right Corner -->
  <path d="M 46 11 Q 48 13 50 13 Q 48 13 46 15 Q 48 13 46 11 Z" fill="#ffd166"/>
  <circle cx="48" cy="13" r="1" fill="#ffffff"/>
</svg>